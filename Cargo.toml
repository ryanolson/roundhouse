[workspace]
resolver = "3"
members = [
    "crates/roundhouse-core",
    "crates/roundhouse-fleet",
    "crates/roundhouse-mcp",
    "crates/roundhouse-store-redis",
    "crates/roundhouse-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
roundhouse-core = { path = "crates/roundhouse-core" }
roundhouse-fleet = { path = "crates/roundhouse-fleet" }
roundhouse-mcp = { path = "crates/roundhouse-mcp" }
roundhouse-store-redis = { path = "crates/roundhouse-store-redis" }

# Dynamo crates, pinned to an upstream commit of ai-dynamo/dynamo.
#
# Not from crates.io: the newest published `dynamo-kv-router` (1.3.1) predates
# DEP #10321, so it neither exports the embeddable `SelectionService` nor uses
# `routing_group` (it still says `tenant_id`). A pinned git dependency also
# resolves `dynamo-truthy`, which the workspace needs and which is unpublished.
#
# Deliberately NOT depending on `dynamo-llm`: its default `block-manager`
# feature pulls `nixl-sys` and `cudarc`, which would drag CUDA into a service
# that never touches a GPU. `dynamo-kv-router` under `standalone-selection`
# carries no `dynamo-runtime` dependency, enforced upstream by
# `lib/kv-router/src/services/CLAUDE.md`.
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "ac7b7513790ef1d619b46f805aea03c9f21200ba", default-features = false, features = [
    "standalone-selection",
] }
dynamo-tokens = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "ac7b7513790ef1d619b46f805aea03c9f21200ba" }
# The mock engine (tests only): simulates vLLM/SGLang scheduling and prefix
# caching without GPUs, and publishes KV events in the vLLM native wire format
# via `zmq-events`. This is what lets the cache-hit path be *measured* rather
# than asserted. Pure Rust — no cudarc, no nixl, no dynamo-runtime.
dynamo-mocker = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "ac7b7513790ef1d619b46f805aea03c9f21200ba", default-features = false, features = [
    "zmq-events",
] }

# Same major/minor and feature shape as Dynamo's own `lib/llm` pin, minus the
# network-facing features: tokenizer files are loaded from disk only.
tokenizers = { version = "0.21.4", default-features = false, features = [
    "onig",
] }

# Pins match the Dynamo workspace so a future move into `lib/` is a no-op.
anyhow = "1"
async-trait = "0.1"
axum = { version = "=0.8.4", features = ["macros", "ws"] }
futures = "0.3"
# Minting a control-plane key (`roundhouse-server/src/control_config.rs`): 32
# bytes straight from the system CSPRNG. `getrandom` rather than `rand`
# because that is the whole requirement -- there is no distribution to sample,
# no seeding story, and no reproducibility question, so a generator framework
# would be three layers over one syscall. Already in the tree transitively (it
# is what `uuid`'s v4 and the TLS stacks draw from), so this adds a name the
# control plane depends on deliberately rather than a crate.
getrandom = "0.3"
# Control-plane key hashing (`roundhouse-server/src/control_config.rs`). Both
# already resolve in the tree transitively (via `redis`/`reqwest`'s TLS
# stacks), so declaring them directly adds no new crate to the build, only a
# name the control plane can depend on deliberately rather than by accident of
# some other crate's graph. SHA-256 rather than a slow KDF: the rationale is
# recorded in `control_config.rs`, not here, because that is where a future
# reader would otherwise "fix" it.
hex = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.17"
# The client-launch config generator (`roundhouse-server/src/codex_launch.rs`)
# emits a `config.toml` for Codex and parses it back in its own unit tests.
# Already resolved in the tree at 0.8.23 (via the pinned Dynamo crates), so
# naming it here adds a dependency edge rather than a crate. Hand-templated
# emission with `toml` used only to *quote* free strings and to parse back:
# serializing a struct would drop the operator-facing WHY comments, which are
# the reason anyone reads a generated config at all.
toml = "0.8.23"
# Caret, resolving to 1.48.0 today: the pinned Dynamo rev's `dynamo-mocker`
# pins tokio exactly, and an exact pin here would just restate that constraint
# where nobody can see whose it is. When Dynamo relaxes, this floats.
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# rustls only -- the Dynamo `deny.toml` bans OpenSSL and we match it.
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
# 1.2, not latest: redis 1.3.0+ carries a target-gated `tokio ^1.51`
# requirement (wasm support) that the resolver unifies workspace-wide, and the
# pinned Dynamo rev's `dynamo-mocker` pins `tokio = "=1.48.0"` exactly — as
# does Dynamo main today. The day Dynamo's tokio pin reaches 1.51, this moves
# to the newest 1.x in a one-line change; until then 1.2.4 is the newest that
# resolves, and it already carries the 1.0 line's fixes (default async
# timeouts, the ConnectionManager retry fix, the TCP-deadlock fix, idempotent
# stream producers).
redis = { version = "1.2", default-features = false, features = [
    "tokio-rustls-comp",
    "streams",
    "script",
    "connection-manager",
] }
# Tests only (`roundhouse-store-redis` dev-dependency): an embedded Lua 5.4, so
# the spend ledger's Lua prelude can be *executed* against the same table of
# calendar cases the Rust port is executed against. Without it the two ports
# only agree where a live Redis is reachable, which is exactly where the suite
# is ignore-gated. `vendored` builds Lua from the bundled C source rather than
# linking a system liblua: no OpenSSL, no pkg-config, and the same answer on
# every machine that has a C compiler.
mlua = { version = "0.12", default-features = false, features = [
    "lua54",
    "vendored",
] }

# `zmq` is pulled in transitively by `dynamo-kv-router/standalone-selection`.
# Declaring it here with `vendored` would build libzmq from source; we instead
# rely on the system `libzmq3-dev`, matching how Dynamo itself builds.

# Required by the codex-rs dev-dependencies in `roundhouse-server` (the
# Responses-API conformance oracle): codex's workspace requests tungstenite
# features (`proxy`, `deflate`) that exist only on OpenAI's forks, and a
# `[patch]` section does not travel with a git dependency, so the consumer
# must restate it. Scope check: axum's websocket feature pins the 0.26 series,
# a different semver line that keeps resolving from crates.io — these patches
# affect only the 0.27/0.28 requirements inside the codex crates, which sit in
# dev-dependencies and never reach the shipped binary.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.dev]
# The KV-router dependency tree is large; without this a debug build of the
# workspace is dominated by dependency codegen we never step through.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
