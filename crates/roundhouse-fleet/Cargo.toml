[package]
name = "roundhouse-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Dynamo fleet and frontier-provider execution backends for Roundhouse"

# The R8 import tool: it reads OpenRouter's versioned benchmark index and
# writes a catalog fragment plus its provenance. Declared explicitly although
# `src/bin/<dir>/main.rs` would be auto-discovered under the same name, because
# the manifest is where a reader looks to find out that this crate ships a
# second artefact at all -- and because the thing worth saying about it is that
# it is a *generator*: nothing in `src/lib.rs` can call it, and no shipped
# `roundhouse` binary contains it. Its modules live under the target's own
# directory for exactly that reason.
[[bin]]
name = "import-benchmarks"
path = "src/bin/import-benchmarks/main.rs"

[dependencies]
roundhouse-core = { workspace = true }

# `standalone-selection` is what provides the embedded `SelectionService`.
# It pulls axum/reqwest/zmq (system libzmq) but still no `dynamo-runtime`.
dynamo-kv-router = { workspace = true, features = ["standalone-selection"] }
dynamo-tokens = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
# `reqwest::Response::bytes_stream` yields `bytes::Bytes`, which the SSE decoder
# in `openai_responses` names in its own signature. Declared rather than reached
# through `reqwest::`: a re-export is not a stability promise.
bytes = "1"
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The mock upstream the provider client is tested against. A hand-rolled axum
# server rather than a mocking crate, matching how the rest of this workspace
# stands in for an HTTP dependency -- and it is what lets a test assert the
# exact headers that *arrived*, which is the whole question a forwarding client
# has to answer.
axum = { workspace = true }
tokio = { workspace = true }
