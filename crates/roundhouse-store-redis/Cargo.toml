[package]
name = "roundhouse-store-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Redis Streams implementation of the Roundhouse SessionStore"

[dependencies]
roundhouse-core = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# `test-support` is the conformance suite: the same assertions that judge
# `MemoryStore` judge this store, which is the whole portability argument.
roundhouse-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
