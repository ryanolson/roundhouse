[package]
name = "roundhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session state machine, context assembly, and routing policy for Roundhouse"

[dependencies]
# Default features only (`default = []`), so this is the protocols + hashing
# surface with no axum/zmq/reqwest and no `dynamo-runtime`. `roundhouse-fleet`
# is what turns on `standalone-selection`.
dynamo-kv-router = { workspace = true, default-features = false }
dynamo-tokens = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# The turn-policy digest (`control/policy.rs`). SHA-256 rather than
# `std::hash`, whose output is explicitly not stable across releases: the
# digest goes into the event log and a replay on a later build has to
# reproduce it. Both already resolve in the tree, so this adds a name rather
# than a crate.
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Exposes `store::contract`, the executable SessionStore conformance suite,
# for backend crates' integration tests (dev-dependencies only). Purely
# additive: no production code is gated on it, so enabling it cannot change
# shipped behavior.
test-support = []

[dev-dependencies]
tokio = { workspace = true }
