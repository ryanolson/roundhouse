[package]
name = "roundhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session state machine, context assembly, and routing policy for Roundhouse"

[dependencies]
# `default-features = false` here, but the workspace entry enables
# `standalone-selection` and inherited features add up, so core builds with it
# too. There is still no `dynamo-runtime`.
dynamo-kv-router = { workspace = true, default-features = false }
dynamo-tokens = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# The turn-policy digest (`control/policy.rs`). SHA-256 rather than
# `std::hash`, whose output is explicitly not stable across releases: the
# digest goes into the event log and a replay on a later build has to
# reproduce it. Both already resolve in the tree, so this adds a name rather
# than a crate.
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Exposes `store::contract`, the executable SessionStore conformance suite,
# for backend crates' integration tests (dev-dependencies only). Purely
# additive: no production code is gated on it, so enabling it cannot change
# shipped behavior.
test-support = []

[dev-dependencies]
# `test-support` exposes `store::contract` and `store::doubles` to this
# crate's own `tests/` binaries, which link against the crate the same way an
# external dependent would and so do not see anything gated on `cfg(test)`.
# The same self-referential trick `roundhouse-server` and
# `roundhouse-store-redis` use for the identical reason.
roundhouse-core = { path = ".", features = ["test-support"] }
tokio = { workspace = true }
