[package]
name = "roundhouse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/SSE transport and binary for Roundhouse"

[lib]
name = "roundhouse_server"
path = "src/lib.rs"

[[bin]]
name = "roundhouse"
path = "src/main.rs"

[dependencies]
roundhouse-core = { workspace = true }
roundhouse-fleet = { workspace = true }
# The MCP control surface. The dependency runs one way only -- `roundhouse-mcp`
# knows nothing of this crate, and supplies the seams (`ControlReads`) this one
# implements. See `src/mcp_api.rs`.
roundhouse-mcp = { workspace = true }
roundhouse-store-redis = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokenizers = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Quoting and parse-back for the generated Codex `config.toml`. See
# `src/codex_launch.rs`.
toml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
# Compiles the `PlaneSource` impl on `ControlPlane` itself -- a plane that is its
# own source and therefore never sees a revocation. Every integration suite
# written before the admin plane mounts its routers over a fixed plane and means
# exactly that; a shipped binary must never be able to, because the whole point
# of the directory is that a router re-resolves per request.
#
# A feature rather than `cfg(test)` because integration tests build the library
# without `cfg(test)`; the self-dev-dependency below turns it on for exactly
# those builds and nothing else, which is the same mechanism (and the same
# reasoning) `roundhouse-store-redis` uses for its `LeaseControl` hook.
test-support = []

# Compiles `tests/codex_e2e.rs`, which drives a **real `codex` binary** against
# a loopback rig. Off by default and deliberately *not* added to the
# self-dev-dependency below: the suite spawns processes, so a developer who has
# no `codex` on PATH, or a CI runner that must not spawn one, gets a test binary
# with nothing in it rather than a failure to explain. Features are additive, so
# `--features e2e-codex` unifies with the `test-support` the dev-dependency
# already turns on. See `tests/codex_e2e.rs` for the invocation.
e2e-codex = []

[dev-dependencies]
# `test-support` is the fixed-plane `PlaneSource` above: it exists so the six
# pre-M8 integration binaries keep mounting the routers with the planes they
# already build, and it does not compile into `cargo build`.
roundhouse-server = { path = ".", features = ["test-support"] }
# The end-to-end cache-hit proof drives a real mock engine that publishes KV
# events into the embedded selection service. See tests/mocker_cache_hits.rs.
dynamo-mocker = { workspace = true }
# `test-support` adds the canonical Redis test fixtures (env var + connect)
# shared with the store's own integration tests. See tests/redis_store.rs.
roundhouse-store-redis = { workspace = true, features = ["test-support"] }

# The SSE tests drive the router as a `tower::Service` and read response bodies
# frame by frame, which is the only way to assert on a stream that has not ended
# yet. Both are already in the tree as axum dependencies. See tests/http_sse.rs.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# The conformance oracle for the OpenAI Responses API surface: Codex's own
# client crates, pinned to an upstream commit of openai/codex, so what our
# `/v1/responses` emits is validated by the exact parser a real agent runs —
# not by our reading of the spec. Dev-only on purpose: codex-http-client pulls
# reqwest with default features (native-tls -> OpenSSL), which must not reach
# the shipped binary's rustls-only graph; with resolver v3, dev-dependency
# features never unify into `cargo build`. See tests/codex_conformance.rs.
codex-api = { git = "https://github.com/openai/codex", rev = "6344a655a5966f92e009a74928fb0559b41f9093" }
codex-client = { git = "https://github.com/openai/codex", rev = "6344a655a5966f92e009a74928fb0559b41f9093" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "6344a655a5966f92e009a74928fb0559b41f9093" }
codex-utils-rustls-provider = { git = "https://github.com/openai/codex", rev = "6344a655a5966f92e009a74928fb0559b41f9093" }
