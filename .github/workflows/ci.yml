name: CI

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the mdBook and check its internal links, so a broken link fails the
  # PR rather than the Pages deploy after merge.
  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
    - name: Build book and check links
      env:
        INSTALL_TOOLS: "1"
      run: bash scripts/build-book.sh
